<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Knora Edu Academy</title>

    <meta
      name="description"
      content="Knora Academy is a premium AI learning platform offering expert-led courses in Artificial Intelligence, Machine Learning, Deep Learning, Generative AI and Computer Vision."
    />

    <meta
      name="keywords"
      content="Knora Academy, AI courses, Artificial Intelligence course, Machine Learning course, Deep Learning, Generative AI, Computer Vision, AI education"
    />

    <meta name="author" content="Knora Academy" />

    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://knoraacademy.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/KNORAwebicon.png" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/KNORAwebicon.png"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Knora Academy | Premium AI Education"
    />

    <meta
      property="og:description"
      content="Learn Artificial Intelligence, Machine Learning, Deep Learning and Generative AI with Knora Academy."
    />

    <meta property="og:url" content="https://knoraacademy.com/" />

    <meta
      property="og:site_name"
      content="Knora Academy"
    />

    <meta
      property="og:image"
      content="https://knoraacademy.com/og-image.png"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Knora Academy | Premium AI Education"
    />

    <meta
      name="twitter:description"
      content="Learn AI, Machine Learning, Deep Learning and Generative AI."
    />

    <meta
      name="twitter:image"
      content="https://knoraacademy.com/og-image.png"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#0ea5e9" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Knora Academy",
      "url": "https://knoraacademy.com/",
      "description": "Premium AI education platform offering courses in Artificial Intelligence, Machine Learning, Deep Learning, Generative AI and Computer Vision."
    }
    </script>

  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
